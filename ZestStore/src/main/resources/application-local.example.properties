# ==============================================
# Local secrets — KHÔNG push lên git
# Copy file này sang application-local.properties và điền giá trị thật
# ==============================================

# SQL Server
spring.datasource.password=YOUR_PASSWORD

# JWT (đổi trong production)
app.jwt.secret=YOUR_JWT_SECRET_KEY_AT_LEAST_256_BITS

# VNPay
payment.vnpay.tmn-code=YOUR_TMN_CODE
payment.vnpay.hash-secret=YOUR_HASH_SECRET

# MoMo
payment.momo.partner-code=YOUR_PARTNER_CODE
payment.momo.access-key=YOUR_ACCESS_KEY
payment.momo.secret-key=YOUR_SECRET_KEY

# ZaloPay
payment.zalopay.app-id=YOUR_APP_ID
payment.zalopay.key1=YOUR_KEY1
payment.zalopay.key2=YOUR_KEY2

# VietQR
payment.vietqr.bank-bin=YOUR_BANK_BIN
payment.vietqr.bank-number=YOUR_BANK_NUMBER
payment.vietqr.bank-name=YOUR_BANK_NAME

# GHN
ghn.token=YOUR_GHN_TOKEN
ghn.shop-id=YOUR_SHOP_ID

# OpenAI
ai.openai.api-key=YOUR_OPENAI_API_KEY

# SMTP
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_APP_PASSWORD
app.admin.email=YOUR_ADMIN_EMAILS
