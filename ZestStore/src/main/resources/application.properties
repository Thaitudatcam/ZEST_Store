spring.application.name=ZestStore
spring.profiles.include=local

# ==============================================
# SQL Server
# ==============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=PoloShopDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================
# JPA / Hibernate
# ==============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ==============================================
# Encoding
# ==============================================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-request=true
spring.servlet.encoding.force-response=true

# ==============================================
# JWT
# ==============================================
app.jwt.secret=${APP_JWT_SECRET:ZestStoreSecretKey2026ForJWTTokenGenerationMustBe256BitsLong}
app.jwt.expiration=86400000

# ==============================================
# File upload
# ==============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=D:/ZEST_Store/uploads

# ==============================================
# Server
# ==============================================
server.port=8080

# ==============================================
# Logging
# ==============================================
logging.level.com.example.zeststore.security=DEBUG
logging.level.com.example.zeststore.service.VnPayService=DEBUG

# ==============================================
# Payment Gateway - VNPay
# ==============================================
payment.vnpay.tmn-code=${PAYMENT_VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${PAYMENT_VNPAY_HASH_SECRET:}
payment.vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8080/api/payments/vnpay/return

# ==============================================
# Payment Gateway - MoMo
# ==============================================
payment.momo.partner-code=${PAYMENT_MOMO_PARTNER_CODE:}
payment.momo.access-key=${PAYMENT_MOMO_ACCESS_KEY:}
payment.momo.secret-key=${PAYMENT_MOMO_SECRET_KEY:}
payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.momo.return-url=http://localhost:8080/api/payments/momo/return
payment.momo.ipn-url=http://localhost:8080/api/payments/momo/ipn

# ==============================================
# Payment Gateway - ZaloPay
# ==============================================
payment.zalopay.app-id=${PAYMENT_ZALOPAY_APP_ID:}
payment.zalopay.key1=${PAYMENT_ZALOPAY_KEY1:}
payment.zalopay.key2=${PAYMENT_ZALOPAY_KEY2:}
payment.zalopay.endpoint=https://sb-openapi.zalopay.vn/v2/create
payment.zalopay.query-endpoint=https://sb-openapi.zalopay.vn/v2/query
payment.zalopay.callback-url=http://localhost:8080/api/payments/zalopay/callback

# ==============================================
# Payment Gateway - VietQR
# ==============================================
payment.vietqr.bank-bin=${PAYMENT_VIETQR_BANK_BIN:}
payment.vietqr.bank-number=${PAYMENT_VIETQR_BANK_NUMBER:}
payment.vietqr.bank-name=${PAYMENT_VIETQR_BANK_NAME:}
payment.vietqr.template=compact2

# ==============================================
# GHN (Giao Hang Nhanh)
# ==============================================
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
ghn.base-url=https://online-gateway.ghn.vn/shiip/public-api
ghn.from-district-id=3440
ghn.from-ward-code=13010

# ==============================================
# Payment Gateway - Redirect to Frontend
# ==============================================
payment.redirect-base-url=http://localhost:5173

# ==============================================
# OpenAI
# ==============================================
ai.openai.api-key=${AI_OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini

# ==============================================
# SMTP (Gmail)
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin.email=${APP_ADMIN_EMAIL:}
