# ==============================================
# Local secrets - KHONG push gia tri that len git
# Copy file nay thanh application-local.properties va dien gia tri local
# ==============================================

# SQL Server
spring.datasource.password=YOUR_SQL_SERVER_PASSWORD

# JWT (toi thieu 32 bytes ngau nhien)
app.jwt.secret=REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG

# VNPay
payment.vnpay.tmn-code=YOUR_VNPAY_TMN_CODE
payment.vnpay.hash-secret=YOUR_VNPAY_HASH_SECRET

# MoMo
payment.momo.partner-code=YOUR_MOMO_PARTNER_CODE
payment.momo.access-key=YOUR_MOMO_ACCESS_KEY
payment.momo.secret-key=YOUR_MOMO_SECRET_KEY

# ZaloPay
payment.zalopay.app-id=YOUR_ZALOPAY_APP_ID
payment.zalopay.key1=YOUR_ZALOPAY_KEY1
payment.zalopay.key2=YOUR_ZALOPAY_KEY2

# VietQR
payment.vietqr.bank-bin=YOUR_BANK_BIN
payment.vietqr.bank-number=YOUR_BANK_ACCOUNT_NUMBER
payment.vietqr.bank-name=YOUR_BANK_NAME

# GHN
ghn.token=YOUR_GHN_TOKEN
ghn.shop-id=YOUR_GHN_SHOP_ID

# OpenAI
ai.openai.api-key=YOUR_OPENAI_API_KEY

# SMTP
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_SMTP_APP_PASSWORD
app.admin.email=YOUR_ADMIN_EMAIL
